services:
  postgres:
    image: postgres:16-alpine
    container_name: smarteach-postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smarteach}
      POSTGRES_USER: ${POSTGRES_USER:-smarteach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smarteach}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-smarteach} -d ${POSTGRES_DB:-smarteach}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smarteach-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: smarteach-minio
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-smarteach}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-smarteachminio}
    command: server /data --console-address ":9001"
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: smarteach-minio-init
    env_file:
      - ../.env
    depends_on:
      - minio
    entrypoint: ['/bin/sh', '/init/create-bucket.sh']
    volumes:
      - ./minio/create-bucket.sh:/init/create-bucket.sh:ro,Z
    restart: 'no'

volumes:
  postgres_data:
  redis_data:
  minio_data:
