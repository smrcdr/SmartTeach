openapi: 3.0.3
info:
  title: SmartTeach API
  version: 0.2.0
  description: |-
    Актуальная спецификация REST API для MVP проекта SmartTeach.
    Спецификация обновлена после пересмотра предметной области и синхронизирована
    с новой структурой базы данных, зафиксированной в `docs/07-database-structure.md`.

    Основные принципы текущего API:
    - центральная сущность системы — группа;
    - `class` и `course` в MVP не выделяются;
    - у группы есть отдельные настройки функций;
    - вступление в группу зависит от `accessMode`;
    - используются локальная авторизация и refresh-сессии;
    - поддерживаются групповые и личные чаты `1 на 1`;
    - расписание строится из уроков, дедлайнов заданий и кастомных событий.
servers:
  - url: http://localhost:3000/api/v1
    description: Локальный REST API
tags:
  - name: System
    description: Служебные маршруты API
  - name: Authentication
    description: Регистрация, вход и работа с JWT-сессией
  - name: Users
    description: Профили пользователей
  - name: Files
    description: Загрузка и получение файлов
  - name: Groups
    description: Работа с группами
  - name: Group Settings
    description: Настройки функций группы
  - name: Group Members
    description: Состав участников группы и роли
  - name: Join Requests
    description: Заявки на вступление в группы с режимом BY_REQUEST
  - name: Lessons
    description: Уроки внутри группы
  - name: Assignments
    description: Задания и попытки сдачи
  - name: Schedule
    description: Календарь группы и кастомные события
  - name: Chats
    description: Групповые и личные чаты
paths:
  /auth/login:
    post:
      description: Проверяет email и пароль и создает новую пользовательскую сессию.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Войти в систему
      tags:
        - Authentication
  /auth/logout:
    post:
      description: Отзывает текущую сессию пользователя по refresh token из cookie.
      responses:
        '204':
          description: Сессия успешно завершена.
      summary: Завершить текущую сессию
      tags:
        - Authentication
  /auth/me:
    get:
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
      summary: Получить текущего пользователя
      tags:
        - Authentication
  /auth/refresh:
    post:
      description: Читает refresh token из cookie, проверяет сессию и выдает новый access token.
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Обновить токены
      tags:
        - Authentication
  /auth/register:
    post:
      description: Создает пользователя, стартовую сессию, выставляет refresh token в cookie и возвращает access token, sessionId и данные пользователя.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Зарегистрировать нового пользователя
      tags:
        - Authentication
  /chats:
    get:
      parameters:
        - in: query
          name: chatType
          required: false
          schema:
            enum:
              - GROUP
              - DIRECT
            type: string
        - in: query
          name: groupId
          required: false
          schema:
            format: uuid
            example: 66666666-6666-4666-8666-666666666666
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Chat'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
      summary: Получить доступные чаты текущего пользователя
      tags:
        - Chats
  /chats/{chatId}:
    get:
      parameters:
        - in: path
          name: chatId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
      summary: Получить чат по идентификатору
      tags:
        - Chats
  /chats/{chatId}/messages:
    get:
      parameters:
        - in: path
          name: chatId
          required: true
          schema:
            format: uuid
            type: string
        - in: query
          name: limit
          required: false
          schema:
            minimum: 1
            maximum: 200
            example: 50
            type: number
        - in: query
          name: before
          required: false
          schema:
            format: date-time
            example: '2026-04-12T12:00:00.000Z'
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
      summary: Получить сообщения чата
      tags:
        - Chats
    post:
      parameters:
        - in: path
          name: chatId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageCreateRequest'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
      summary: Отправить сообщение
      tags:
        - Chats
  /chats/{chatId}/messages/{messageId}:
    delete:
      description: Выполняет мягкое удаление сообщения.
      parameters:
        - in: path
          name: chatId
          required: true
          schema:
            format: uuid
            type: string
        - in: path
          name: messageId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '204':
          description: Сообщение успешно удалено.
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
      summary: Удалить сообщение
      tags:
        - Chats
    patch:
      parameters:
        - in: path
          name: chatId
          required: true
          schema:
            format: uuid
            type: string
        - in: path
          name: messageId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageUpdateRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
      summary: Отредактировать сообщение
      tags:
        - Chats
  /chats/direct:
    post:
      description: Возвращает существующий direct-чат 1 на 1 или создает новый, если его еще нет.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDirectChatRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
      summary: Создать или получить личный чат
      tags:
        - Chats
  /files:
    post:
      description: Загружает файл в объектное хранилище и возвращает его метаданные.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadFileRequest'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileObject'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
      summary: Загрузить файл
      tags:
        - Files
  /files/{fileId}:
    delete:
      description: Выполняет мягкое удаление файла и делает его недоступным для новых привязок.
      parameters:
        - in: path
          name: fileId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '204':
          description: Файл успешно удален.
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
      summary: Удалить файл
      tags:
        - Files
    get:
      parameters:
        - in: path
          name: fileId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileObject'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
      summary: Получить метаданные собственного файла
      tags:
        - Files
  /groups:
    get:
      description: Возвращает группы с учетом фильтров, прав доступа и участия текущего пользователя.
      parameters:
        - in: query
          name: search
          required: false
          schema:
            example: frontend
            type: string
        - in: query
          name: code
          required: false
          schema:
            example: WEBSPR1
            type: string
        - in: query
          name: accessMode
          required: false
          schema:
            enum:
              - OPEN
              - BY_REQUEST
              - CLOSED
            type: string
        - in: query
          name: status
          required: false
          schema:
            enum:
              - ACTIVE
              - ARCHIVED
              - DELETED
            type: string
        - in: query
          name: joinedOnly
          required: false
          schema:
            example: true
            type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
      summary: Получить список групп
      tags:
        - Groups
    post:
      description: Создает группу, настройки группы и запись владельца в составе участников.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
      summary: Создать группу
      tags:
        - Groups
  /groups/{groupId}:
    delete:
      description: Выполняет мягкое удаление группы и переводит ее в статус DELETED.
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '204':
          description: Группа успешно удалена.
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
      summary: Удалить группу
      tags:
        - Groups
    get:
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
      summary: Получить группу по идентификатору
      tags:
        - Groups
    patch:
      description: Позволяет владельцу или администратору обновить базовые поля группы.
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroupRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
      summary: Обновить группу
      tags:
        - Groups
  /groups/{groupId}/assignments:
    get:
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            format: uuid
            type: string
        - in: query
          name: status
          required: false
          schema:
            enum:
              - DRAFT
              - PUBLISHED
              - ARCHIVED
            type: string
        - in: query
          name: lessonId
          required: false
          schema:
            format: uuid
            example: 77777777-7777-4777-8777-777777777777
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Assignment'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
      summary: Получить список заданий группы
      tags:
        - Assignments
    post:
      description: Доступно владельцу и администраторам группы, если assignments_enabled включен.
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssignmentRequest'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
      summary: Создать задание
      tags:
        - Assignments
  /groups/{groupId}/assignments/{assignmentId}:
    get:
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            format: uuid
            type: string
        - in: path
          name: assignmentId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
      summary: Получить задание
      tags:
        - Assignments
    patch:
      description: Позволяет менять статус, дедлайн, lessonId и набор привязанных файлов задания.
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            format: uuid
            type: string
        - in: path
          name: assignmentId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssignmentRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
