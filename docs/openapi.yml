components:
  securitySchemes:
    bearerAuth:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    Assignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 88888888-8888-4888-8888-888888888888
        groupId:
          type: string
          format: uuid
          example: 66666666-6666-4666-8666-666666666666
        lessonId:
          type: object
          format: uuid
          nullable: true
          example: 77777777-7777-4777-8777-777777777777
        title:
          type: string
          minLength: 2
          maxLength: 200
          example: Prepare contract review
        content:
          type: object
          nullable: true
          example: Подготовьте разбор API-контракта и зафиксируйте спорные поля.
        status:
          type: string
          enum:
            - DRAFT
            - PUBLISHED
            - ARCHIVED
          example: PUBLISHED
        dueAt:
          type: object
          format: date-time
          nullable: true
        maxScore:
          type: object
          minimum: 0
          nullable: true
          example: 100
        publishedAt:
          type: object
          format: date-time
          nullable: true
        archivedAt:
          type: object
          format: date-time
          nullable: true
        createdByUserId:
          type: string
          format: uuid
          example: 11111111-1111-4111-8111-111111111111
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileObject'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - groupId
        - title
        - status
        - createdByUserId
        - files
        - createdAt
        - updatedAt
    AuthSession:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
        sessionId:
          type: string
          format: uuid
          example: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
      required:
        - user
        - accessToken
        - sessionId
    Chat:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: fffffff1-ffff-4fff-8fff-fffffffffff1
        chatType:
          type: string
          enum:
            - GROUP
            - DIRECT
          example: GROUP
        groupId:
          type: object
          format: uuid
          nullable: true
          example: 66666666-6666-4666-8666-666666666666
        title:
          type: object
          nullable: true
          example: Общий чат Web Basics
        createdByUserId:
          type: string
          format: uuid
          example: 11111111-1111-4111-8111-111111111111
        lastMessageAt:
          type: object
          format: date-time
          nullable: true
          example: '2026-04-12T11:30:00.000Z'
        members:
          type: array
          items:
            $ref: '#/components/schemas/ChatMember'
        createdAt:
          type: string
          format: date-time
          example: '2026-04-12T10:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-04-12T11:30:00.000Z'
      required:
        - id
        - chatType
        - createdByUserId
        - members
        - createdAt
        - updatedAt
    ChatMember:
      type: object
      properties:
        userId:
          type: string
          format: uuid
          example: 11111111-1111-4111-8111-111111111111
        joinedAt:
          type: string
          format: date-time
          example: '2026-04-12T10:00:00.000Z'
        lastReadAt:
          type: object
          format: date-time
          nullable: true
          example: '2026-04-12T11:30:00.000Z'
        createdAt:
          type: string
          format: date-time
          example: '2026-04-12T10:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-04-12T11:30:00.000Z'
        user:
          $ref: '#/components/schemas/PublicUser'
      required:
        - userId
        - joinedAt
        - createdAt
        - updatedAt
        - user
    CreateAssignmentRequest:
      type: object
      properties:
        lessonId:
          type: string
          format: uuid
          example: 77777777-7777-4777-8777-777777777777
        title:
          type: string
          minLength: 2
          maxLength: 200
          example: Prepare contract review
        content:
          type: string
          example: Сравните итоговую реализацию с OpenAPI и опишите расхождения.
        status:
          type: string
          enum:
            - DRAFT
            - PUBLISHED
            - ARCHIVED
          example: DRAFT
        dueAt:
          type: string
          format: date-time
          example: '2026-04-20T18:00:00.000Z'
        maxScore:
          type: number
          minimum: 0
          example: 100
        fileIds:
          example:
            - aaaaaaa4-aaaa-4aaa-8aaa-aaaaaaaaaaa4
          type: array
          items:
            type: string
      required:
        - title
    CreateDirectChatRequest:
      type: object
      properties:
        userId:
          type: string
          format: uuid
          example: 33333333-3333-4333-8333-333333333333
      required:
        - userId
    CreateGroupMemberRequest:
      type: object
      properties:
        userId:
          type: string
          format: uuid
          example: 33333333-3333-4333-8333-333333333333
        role:
          type: string
          enum:
            - OWNER
            - ADMIN
            - USER
          example: ADMIN
      required:
        - userId
    CreateGroupRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
          example: Frontend Patterns Lab
        description:
          type: string
          example: Группа для разбора компонентного мышления и интерфейсных паттернов.
        accessMode:
          type: string
          enum:
            - OPEN
            - BY_REQUEST
            - CLOSED
          example: BY_REQUEST
        settings:
          $ref: '#/components/schemas/GroupSettings'
      required:
        - name
        - accessMode
        - settings
    CreateLessonRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 200
          example: Intro to REST contracts
        content:
          type: string
          example: Разбираем базовые REST-паттерны и итоговый контракт lesson module.
        status:
          type: string
          enum:
            - DRAFT
            - PUBLISHED
            - ARCHIVED
          example: DRAFT
        sortOrder:
          type: number
          minimum: 1
          example: 20
        startsAt:
          type: string
          format: date-time
          example: '2026-04-15T09:00:00.000Z'
        endsAt:
          type: string
          format: date-time
          example: '2026-04-15T10:30:00.000Z'
        fileIds:
          example:
            - aaaaaaa3-aaaa-4aaa-8aaa-aaaaaaaaaaa3
          type: array
          items:
            type: string
      required:
        - title
    CreateScheduleEventRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 200
          example: Demo day rehearsal
        description:
          type: string
          example: Репетиция финальной презентации перед защитой.
        startsAt:
          type: string
          format: date-time
          example: '2026-04-16T12:00:00.000Z'
        endsAt:
          type: string
          format: date-time
          example: '2026-04-16T13:30:00.000Z'
        location:
          type: string
          example: Zoom / Room 204
      required:
        - title
        - startsAt
        - endsAt
    CreateSubmissionRequest:
      type: object
      properties:
        text:
          type: string
          example: Готовая работа и комментарии по спорным местам реализации.
        fileIds:
          example:
            - bbbbbbb1-bbbb-4bbb-8bbb-bbbbbbbbbbb1
          type: array
          items:
            type: string
        status:
          type: string
          enum:
            - DRAFT
            - SUBMITTED
          example: DRAFT
    ErrorResponse:
      type: object
      properties:
        statusCode:
          type: number
          example: 400
        message:
          type: string
          example: Validation failed
        errors:
          example:
            - 'email: Invalid email address'
          type: array
          items:
            type: string
      required:
        - statusCode
        - message
    FileObject:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: aaaaaaa1-aaaa-4aaa-8aaa-aaaaaaaaaaa1
        originalName:
          type: string
          example: avatar.png
        mimeType:
          type: string
          example: image/png
        sizeBytes:
          type: number
          example: 204800
        uploadedByUserId:
          type: string
          format: uuid
          example: bbbbbbb2-bbbb-4bbb-8bbb-bbbbbbbbbbb2
        url:
          type: string
          format: uri
          example: http://localhost:9000/smarteach-files/avatars/2026/04/12/aBcD1234xYz9.png?X-Amz-Algorithm=AWS4-HMAC-SHA256
        createdAt:
          type: string
          format: date-time
          example: '2026-04-12T00:00:00.000Z'
      required:
        - id
        - originalName
        - mimeType
        - sizeBytes
        - uploadedByUserId
        - url
        - createdAt
    Group:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 66666666-6666-4666-8666-666666666666
        code:
          type: string
          example: WEBSPR1
        name:
          type: string
          minLength: 2
          maxLength: 150
          example: Web Basics Spring 2026
        description:
          type: object
          nullable: true
          example: Открытая группа для отработки HTML, CSS и базового JavaScript.
        ownerId:
          type: string
          format: uuid
          example: 11111111-1111-4111-8111-111111111111
        owner:
          $ref: '#/components/schemas/PublicUser'
        accessMode:
          type: string
          enum:
            - OPEN
            - BY_REQUEST
            - CLOSED
          example: OPEN
        status:
          type: string
          enum:
            - ACTIVE
            - ARCHIVED
            - DELETED
          example: ACTIVE
        settings:
          $ref: '#/components/schemas/GroupSettings'
        membersCount:
          type: number
          minimum: 0
          example: 3
        viewerMembershipRole:
          type: string
          enum:
            - OWNER
            - ADMIN
            - USER
          nullable: true
          description: Роль текущего пользователя в группе, если он уже состоит в ней.
          example: USER
        viewerJoinRequestStatus:
          type: string
          enum:
            - PENDING
            - APPROVED
            - REJECTED
          nullable: true
          description: Последний известный статус заявки текущего пользователя в эту группу.
          example: PENDING
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archivedAt:
          type: object
          format: date-time
          nullable: true
        deletedAt:
          type: object
          format: date-time
          nullable: true
      required:
        - id
        - code
        - name
        - ownerId
        - owner
        - accessMode
        - status
        - settings
        - membersCount
        - createdAt
        - updatedAt
    GroupChatCreateRequest:
      type: object
      properties:
        title:
          type: string
