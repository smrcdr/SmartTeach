openapi: 3.0.3
info:
  title: SmartTeach API
  version: 0.2.0
  description: |
    Актуальная спецификация REST API для MVP проекта SmartTeach.
    Спецификация обновлена после пересмотра предметной области и синхронизирована
    с новой структурой базы данных, зафиксированной в `docs/07-database-structure.md`.

    Основные принципы текущего API:
    - центральная сущность системы — группа;
    - `class` и `course` в MVP не выделяются;
    - у группы есть отдельные настройки функций;
    - вступление в группу зависит от `accessMode`;
    - используются локальная авторизация и refresh-сессии;
    - поддерживаются групповые и личные чаты `1 на 1`;
    - расписание строится из уроков, дедлайнов заданий и кастомных событий.
servers:
  - url: http://localhost:3000/api/v1
    description: Локальный REST API
security:
  - bearerAuth: []
tags:
  - name: System
    description: Служебные маршруты API
  - name: Authentication
    description: Регистрация, вход и работа с JWT-сессией
  - name: Users
    description: Профили пользователей
  - name: Files
    description: Загрузка и получение файлов
  - name: Groups
    description: Работа с группами
  - name: Group Settings
    description: Настройки функций группы
  - name: Group Members
    description: Состав участников группы и роли
  - name: Join Requests
    description: Заявки на вступление в группы с режимом BY_REQUEST
  - name: Lessons
    description: Уроки внутри группы
  - name: Assignments
    description: Задания и попытки сдачи
  - name: Schedule
    description: Календарь группы и кастомные события
  - name: Chats
    description: Групповые и личные чаты
paths:
  /health:
    get:
      tags:
        - System
      security: []
      summary: Проверить доступность API
      responses:
        '200':
          description: API доступен и готов принимать запросы.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - timestamp
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  /auth/register:
    post:
      tags:
        - Authentication
      security: []
      summary: Зарегистрировать нового пользователя
      description: Создает пользователя, стартовую сессию и возвращает пару токенов.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь успешно зарегистрирован.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /auth/login:
    post:
      tags:
        - Authentication
      security: []
      summary: Войти в систему
      description: Проверяет email и пароль и создает новую пользовательскую сессию.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Авторизация выполнена успешно.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/refresh:
    post:
      tags:
        - Authentication
      security: []
      summary: Обновить токены
      description: Принимает refresh token, проверяет сессию и выдает новую пару токенов.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Токены успешно обновлены.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Завершить текущую сессию
      description: Отзывает текущую сессию пользователя по refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Сессия успешно завершена.
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Получить текущего пользователя
      responses:
        '200':
          description: Профиль текущего пользователя.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /users/me:
    patch:
      tags:
        - Users
      summary: Обновить собственный профиль
      description: Позволяет изменить display name, bio и avatar пользователя.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMyProfileRequest'
      responses:
        '200':
          description: Профиль успешно обновлен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /users/{userId}:
    get:
      tags:
        - Users
      summary: Получить публичный профиль пользователя
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Публичные данные пользователя.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUser'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /files:
    post:
      tags:
        - Files
      summary: Загрузить файл
      description: Загружает файл в объектное хранилище и возвращает его метаданные.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                folder:
                  type: string
                  description: Логическая папка, например avatars, lessons, assignments, submissions, messages.
      responses:
        '201':
          description: Файл успешно загружен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileObject'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /files/{fileId}:
    get:
      tags:
        - Files
      summary: Получить метаданные файла
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: Метаданные файла.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileObject'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags:
        - Files
      summary: Удалить файл
      description: Выполняет мягкое удаление файла и делает его недоступным для новых привязок.
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '204':
          description: Файл успешно удален.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /groups:
    get:
      tags:
        - Groups
      summary: Получить список групп
      description: Возвращает список групп с учетом фильтров и прав доступа текущего пользователя.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Поиск по названию и описанию.
        - name: code
          in: query
          required: false
          schema:
            type: string
          description: Поиск по короткому коду группы.
        - name: accessMode
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/GroupAccessMode'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/GroupStatus'
        - name: joinedOnly
          in: query
          required: false
          schema:
            type: boolean
          description: Возвращать только группы, где состоит текущий пользователь.
      responses:
        '200':
          description: Список групп.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags:
        - Groups
      summary: Создать группу
      description: Создает группу, настройки группы и запись владельца в составе участников.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreateRequest'
      responses:
        '201':
          description: Группа успешно создана.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /groups/by-code/{code}:
    get:
      tags:
        - Groups
      summary: Найти группу по коду
      description: Быстрый поиск группы по автоматически сгенерированному короткому коду.
      parameters:
        - $ref: '#/components/parameters/GroupCode'
      responses:
        '200':
          description: Группа найдена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /groups/{groupId}:
    get:
      tags:
        - Groups
      summary: Получить группу по идентификатору
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Детальная информация о группе.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags:
        - Groups
      summary: Обновить группу
      description: Позволяет владельцу или администратору обновить базовые поля группы.
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupUpdateRequest'
      responses:
        '200':
          description: Группа успешно обновлена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags:
        - Groups
      summary: Удалить группу
      description: Выполняет мягкое удаление группы и переводит ее в статус `DELETED`.
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '204':
          description: Группа успешно удалена.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /groups/{groupId}/settings:
    get:
      tags:
        - Group Settings
      summary: Получить настройки группы
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Настройки группы.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSettings'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags:
        - Group Settings
      summary: Обновить настройки группы
      description: Позволяет включать и отключать функции группы.
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupSettingsUpdateRequest'
      responses:
        '200':
          description: Настройки успешно обновлены.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSettings'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /groups/{groupId}/join:
    post:
      tags:
        - Group Members
      summary: Вступить в открытую группу
      description: Работает только для групп с режимом `OPEN`. Для групп `BY_REQUEST` нужно использовать `/join-requests`.
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Пользователь успешно добавлен в группу.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMember'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /groups/{groupId}/leave:
    post:
      tags:
        - Group Members
      summary: Покинуть группу
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '204':
          description: Пользователь успешно покинул группу.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /groups/{groupId}/members:
    get:
      tags:
        - Group Members
      summary: Получить участников группы
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Список участников группы.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupMember'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      tags:
        - Group Members
      summary: Добавить участника в группу вручную
      description: Используется владельцем или администратором, в том числе для закрытых групп.
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupMemberCreateRequest'
      responses:
        '201':
          description: Пользователь успешно добавлен в группу.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMember'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /groups/{groupId}/members/{userId}:
    patch:
      tags:
        - Group Members
      summary: Изменить роль участника
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupMemberUpdateRequest'
      responses:
        '200':
          description: Роль участника успешно обновлена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMember'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags:
        - Group Members
      summary: Удалить участника из группы
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Участник успешно удален из группы.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /groups/{groupId}/join-requests:
    get:
      tags:
        - Join Requests
      summary: Получить заявки на вступление
      description: Доступно владельцу и администраторам группы.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/JoinRequestStatus'
      responses:
        '200':
          description: Список заявок.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupJoinRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      tags:
        - Join Requests
      summary: Подать заявку на вступление
      description: Создает заявку в группу с режимом `BY_REQUEST`.
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '201':
          description: Заявка успешно создана.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupJoinRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /groups/{groupId}/join-requests/{requestId}:
    patch:
      tags:
        - Join Requests
      summary: Рассмотреть заявку на вступление
      description: Позволяет одобрить или отклонить заявку.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinRequestDecisionRequest'
      responses:
        '200':
          description: Заявка успешно обработана.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupJoinRequest'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /groups/{groupId}/lessons:
    get:
      tags:
        - Lessons
      summary: Получить список уроков группы
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/LessonStatus'
      responses:
        '200':
          description: Список уроков.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lesson'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      tags:
        - Lessons
      summary: Создать урок
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonCreateRequest'
      responses:
        '201':
          description: Урок успешно создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /groups/{groupId}/lessons/{lessonId}:
    get:
      tags:
        - Lessons
      summary: Получить урок
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/LessonId'
      responses:
        '200':
          description: Данные урока.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags:
        - Lessons
      summary: Обновить урок
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/LessonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonUpdateRequest'
      responses:
        '200':
          description: Урок успешно обновлен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
