        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID пользователя.
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID файла.
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID группы.
    GroupCode:
      name: code
      in: path
      required: true
      schema:
        type: string
      description: Короткий код группы.
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID заявки на вступление.
    LessonId:
      name: lessonId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID урока.
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID задания.
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID попытки сдачи.
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID кастомного события.
    ChatId:
      name: chatId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID чата.
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID сообщения.

  responses:
    ValidationError:
      description: Ошибка валидации входных данных.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: Пользователь не авторизован.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: Недостаточно прав для выполнения операции.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Ресурс не найден.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConflictError:
      description: Конфликт состояния ресурса.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required:
        - statusCode
        - message
      properties:
        statusCode:
          type: integer
          example: 400
        message:
          type: string
          example: Validation failed
        errors:
          type: array
          items:
            type: string

    GroupAccessMode:
      type: string
      enum:
        - OPEN
        - BY_REQUEST
        - CLOSED
      description: Режим вступления в группу.

    GroupStatus:
      type: string
      enum:
        - ACTIVE
        - ARCHIVED
        - DELETED
      description: Статус группы.

    GroupEditableStatus:
      type: string
      enum:
        - ACTIVE
        - ARCHIVED
      description: Статус группы, доступный через обычное редактирование.

    GroupRole:
      type: string
      enum:
        - OWNER
        - ADMIN
        - USER
      description: Роль пользователя внутри группы.

    JoinRequestStatus:
      type: string
      enum:
        - PENDING
        - APPROVED
        - REJECTED
      description: Статус заявки на вступление.

    JoinRequestDecision:
      type: string
      enum:
        - APPROVED
        - REJECTED
      description: Решение по заявке на вступление.

    LessonStatus:
      type: string
      enum:
        - DRAFT
        - PUBLISHED
        - ARCHIVED
      description: Статус урока.

    AssignmentStatus:
      type: string
      enum:
        - DRAFT
        - PUBLISHED
        - ARCHIVED
      description: Статус задания.

    SubmissionStatus:
      type: string
      enum:
        - DRAFT
        - SUBMITTED
        - REVIEWED
      description: Статус попытки сдачи.

    ScheduleEventStatus:
      type: string
      enum:
        - PLANNED
        - CANCELLED
      description: Статус кастомного события.

    ScheduleEntryType:
