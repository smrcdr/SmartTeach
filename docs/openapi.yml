        - mimeType
        - size
        - url
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
        mimeType:
          type: string
        size:
          type: integer
          format: int64
        url:
          type: string
          format: uri
        createdAt:
          type: string
          format: date-time
    GroupFeatures:
      type: object
      required:
