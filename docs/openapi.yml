        - assignmentsEnabled
        - scheduleEnabled
      properties:
        chatEnabled:
          type: boolean
        lessonsEnabled:
          type: boolean
        assignmentsEnabled:
          type: boolean
        scheduleEnabled:
          type: boolean
    Group:
      type: object
      required:
