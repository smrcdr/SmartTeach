            - APPROVED
            - REJECTED
          example: PENDING
        reviewedByUserId:
          type: object
          format: uuid
          nullable: true
        reviewedAt:
          type: object
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        user:
