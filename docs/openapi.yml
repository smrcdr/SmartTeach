        - Administration
      summary: Изменить глобальную роль пользователя
      description: Позволяет администратору сервиса назначить пользователю роль USER, MODERATOR или ADMIN.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        description: Новая глобальная роль пользователя.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRoleUpdateRequest'
      responses:
        '200':
          description: Глобальная роль пользователя успешно обновлена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /admin/groups:
    get:
      tags:
        - Administration
      summary: Получить список групп для модерации
      description: Возвращает список групп сервиса для административного контроля, аудита и модерации.
      parameters:
        - name: search
          in: query
          required: false
          description: Поиск по названию и описанию группы.
          schema:
            type: string
        - name: moderationStatus
          in: query
          required: false
          description: Фильтр по модерационному статусу группы.
          schema:
            $ref: '#/components/schemas/ModerationStatus'
      responses:
        '200':
          description: Список групп для модерации получен успешно.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /admin/groups/{groupId}/status:
    patch:
      tags:
        - Administration
      summary: Изменить модерационный статус группы
      description: Позволяет администратору или модератору заблокировать, восстановить или архивировать группу на уровне сервиса.
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        description: Новый модерационный статус группы и причина изменения.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationStatusUpdateRequest'
      responses:
        '200':
          description: Модерационный статус группы успешно обновлен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: Идентификатор пользователя.
      schema:
        type: string
        format: uuid
    FileId:
      name: fileId
      in: path
      required: true
      description: Идентификатор файла в хранилище.
      schema:
        type: string
        format: uuid
    GroupId:
      name: groupId
      in: path
      required: true
      description: Идентификатор группы.
      schema:
        type: string
        format: uuid
    MemberId:
      name: memberId
      in: path
      required: true
      description: Идентификатор участника группы, обычно совпадает с идентификатором пользователя.
      schema:
        type: string
        format: uuid
    LessonId:
      name: lessonId
      in: path
      required: true
      description: Идентификатор урока.
      schema:
        type: string
        format: uuid
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      description: Идентификатор домашнего задания.
      schema:
        type: string
        format: uuid
    SubmissionId:
      name: submissionId
      in: path
      required: true
      description: Идентификатор сдачи домашнего задания.
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      description: Идентификатор события расписания.
      schema:
        type: string
        format: uuid
    ChatId:
      name: chatId
      in: path
      required: true
      description: Идентификатор чата.
      schema:
        type: string
        format: uuid
    MessageId:
      name: messageId
      in: path
      required: true
      description: Идентификатор сообщения.
      schema:
        type: string
        format: uuid
    PresetKey:
      name: presetKey
      in: path
      required: true
      description: Ключ преднастроенного шаблона группы.
      schema:
        type: string
        enum:
          - class
          - course
          - basic
  responses:
    ValidationError:
      description: Запрос не прошел валидацию.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: Пользователь не авторизован или токен недействителен.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: У пользователя недостаточно прав для выполнения операции.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Запрашиваемый ресурс не найден.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConflictError:
      description: Операция не может быть выполнена из-за конфликта состояния.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ServiceRole:
      type: string
      enum:
        - USER
        - MODERATOR
        - ADMIN
      description: Глобальная роль пользователя на уровне сервиса.
    GroupRole:
      type: string
      enum:
        - OWNER
        - ADMIN
        - USER
      description: Роль пользователя внутри группы.
    GroupKind:
      type: string
      enum:
        - BASIC
        - CLASS
        - COURSE
      description: Логический тип группы.
    Visibility:
      type: string
      enum:
        - PUBLIC
        - PRIVATE
      description: Видимость группы и способ присоединения к ней.
    ModerationStatus:
      type: string
      enum:
        - ACTIVE
        - BLOCKED
        - ARCHIVED
      description: Модерационный статус ресурса на уровне сервиса.
    ChatType:
      type: string
      enum:
        - GROUP
        - ANNOUNCEMENT
        - PRIVATE
      description: Тип чата внутри группы.
    SubmissionStatus:
      type: string
      enum:
        - DRAFT
        - SUBMITTED
        - REVIEWED
        - RETURNED
      description: Текущий статус сдачи домашнего задания.
    ScheduleEventType:
      type: string
      enum:
        - LESSON
        - HOMEWORK_DEADLINE
        - MEETING
        - CUSTOM
      description: Тип события в расписании группы.
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: validation_error
        message:
          type: string
          example: Переданные данные не прошли проверку.
        details:
          type: array
          items:
            type: object
            additionalProperties: true
    TokenPair:
      type: object
      required:
        - accessToken
        - refreshToken
      properties:
        accessToken:
          type: string
          description: JWT-токен доступа.
        refreshToken:
          type: string
          description: JWT-токен для обновления сессии.
    User:
      type: object
      required:
        - id
        - email
        - displayName
        - serviceRole
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        bio:
          type: string
          nullable: true
        avatarFileId:
          type: string
          format: uuid
          nullable: true
        serviceRole:
          $ref: '#/components/schemas/ServiceRole'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AuthSession:
      type: object
      required:
        - user
        - accessToken
        - refreshToken
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
        refreshToken:
          type: string
    FileObject:
      type: object
      required:
