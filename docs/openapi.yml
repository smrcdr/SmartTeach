openapi: 3.0.3
info:
  title: SmartTeach API
  version: 0.1.0
  description: |
    Черновая спецификация API для проекта SmartTeach.
    Спецификация составлена по текущему описанию проекта и включает проектные допущения
    там, где точный контракт еще не был формально зафиксирован.
servers:
  - url: http://localhost:3000/api/v1
    description: Локальный REST API
security:
  - bearerAuth: []
tags:
  - name: System
    description: Служебные маршруты API
  - name: Authentication
    description: Регистрация, вход и работа с JWT-сессией
  - name: Users
    description: Профили пользователей и персональные настройки
  - name: Files
    description: Загрузка и удаление файлов в MinIO
  - name: Groups
    description: Работа с группами как основной сущностью системы
  - name: Group Members
    description: Участники группы и управление ролями внутри группы
  - name: Group Features
    description: Настройки и включаемые функции группы
  - name: Group Presets
    description: Быстрые шаблоны конфигурации группы, например класс или курс
  - name: Lessons
    description: Уроки внутри учебных групп и курсов
  - name: Assignments
    description: Домашние задания и сдачи работ
  - name: Schedule
    description: Расписание и календарные события группы
  - name: Chats
    description: Чаты группы и сообщения
  - name: Administration
    description: Административные и модераторские операции уровня сервиса
paths:
  /health:
    get:
      tags:
        - System
      security: []
      summary: Проверить доступность API
      description: Возвращает признак доступности сервиса и текущее серверное время.
      responses:
        '200':
          description: API доступен и готов принимать запросы.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - timestamp
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  /auth/register:
    post:
      tags:
        - Authentication
      security: []
      summary: Зарегистрировать нового пользователя
      description: Создает нового пользователя с глобальной ролью USER и возвращает JWT-сессию.
      requestBody:
        required: true
        description: Данные для регистрации нового пользователя.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь успешно зарегистрирован.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /auth/login:
    post:
      tags:
        - Authentication
      security: []
      summary: Войти в систему
      description: Проверяет учетные данные пользователя и выдает новую пару JWT-токенов.
      requestBody:
        required: true
        description: Логин и пароль пользователя.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Авторизация выполнена успешно.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/refresh:
    post:
      tags:
        - Authentication
      security: []
      summary: Обновить пару токенов
      description: Принимает refresh token и возвращает новую пару токенов доступа.
      requestBody:
        required: true
        description: Refresh token текущей сессии.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Токены успешно обновлены.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Завершить текущую сессию
      description: Инвалидирует текущую сессию пользователя и привязанный refresh token.
      requestBody:
        required: false
        description: При необходимости может содержать refresh token для явного отзыва.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Сессия успешно завершена.
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Получить текущего пользователя
      description: Возвращает профиль текущего авторизованного пользователя.
      responses:
        '200':
          description: Профиль текущего пользователя.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /users/me:
    patch:
      tags:
        - Users
      summary: Обновить собственный профиль
      description: Позволяет пользователю изменить отображаемое имя, описание профиля и аватар.
      requestBody:
        required: true
        description: Обновляемые поля профиля пользователя.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMyProfileRequest'
      responses:
        '200':
          description: Профиль успешно обновлен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /users/{userId}:
    get:
      tags:
        - Users
      summary: Получить профиль пользователя
      description: Возвращает публичные данные пользователя по его идентификатору.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Публичный профиль пользователя.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /files:
    post:
      tags:
        - Files
      summary: Загрузить файл
      description: Загружает файл в MinIO и возвращает его метаданные для дальнейшего использования в сообщениях, профиле и других пользовательских данных.
      requestBody:
        required: true
        description: Multipart-запрос с бинарным файлом.
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                folder:
                  type: string
                  description: Логическая папка хранения, например avatars или chat-files.
      responses:
        '201':
          description: Файл успешно загружен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileObject'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /files/{fileId}:
    get:
      tags:
        - Files
      summary: Получить метаданные файла
      description: Возвращает информацию о файле и ссылку для его скачивания или просмотра.
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: Метаданные файла.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileObject'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags:
        - Files
      summary: Удалить файл
      description: Удаляет файл из хранилища, если у пользователя есть права на удаление.
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '204':
          description: Файл успешно удален.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /groups:
    get:
      tags:
        - Groups
      summary: Получить список групп
      description: Возвращает список групп с возможностью фильтрации по типу, поисковой строке и принадлежности текущему пользователю.
      parameters:
        - name: kind
          in: query
          required: false
          description: Фильтр по типу группы.
          schema:
            $ref: '#/components/schemas/GroupKind'
        - name: search
          in: query
          required: false
          description: Поиск по названию или описанию группы.
          schema:
            type: string
        - name: joinedOnly
          in: query
          required: false
          description: Возвращать только группы, в которых состоит текущий пользователь.
          schema:
            type: boolean
      responses:
        '200':
          description: Список групп получен успешно.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags:
        - Groups
      summary: Создать группу
      description: Создает новую группу и назначает текущего пользователя ее владельцем.
      requestBody:
        required: true
        description: Данные новой группы.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreateRequest'
      responses:
        '201':
          description: Группа успешно создана.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /groups/{groupId}:
    get:
      tags:
        - Groups
      summary: Получить группу по идентификатору
      description: Возвращает детальную информацию о группе, ее настройках и текущем статусе.
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Информация о группе получена успешно.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags:
        - Groups
      summary: Обновить группу
      description: Позволяет владельцу или администратору изменить название, описание, тип видимости и базовые параметры группы.
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        description: Поля группы, которые требуется обновить.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupUpdateRequest'
      responses:
        '200':
          description: Группа успешно обновлена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags:
        - Groups
      summary: Удалить группу
      description: Удаляет группу или переводит ее в архивный статус в зависимости от принятой бизнес-логики реализации.
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '204':
          description: Группа успешно удалена или архивирована.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /groups/{groupId}/join:
    post:
      tags:
        - Group Members
      summary: Вступить в группу
      description: Добавляет текущего пользователя в группу. Для закрытых групп может использоваться код приглашения.
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: false
        description: Дополнительные данные для вступления в группу.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupJoinRequest'
      responses:
        '200':
          description: Пользователь успешно добавлен в группу.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMember'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /groups/{groupId}/leave:
    post:
      tags:
        - Group Members
      summary: Покинуть группу
      description: Удаляет текущего пользователя из состава участников группы.
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '204':
          description: Пользователь успешно покинул группу.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /groups/{groupId}/members:
    get:
      tags:
        - Group Members
      summary: Получить участников группы
      description: Возвращает список участников группы вместе с ролями внутри группы.
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Список участников получен успешно.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupMember'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /groups/{groupId}/members/{memberId}:
    patch:
      tags:
        - Group Members
      summary: Изменить роль участника группы
      description: Позволяет владельцу или администратору изменить роль конкретного участника внутри группы.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/MemberId'
      requestBody:
        required: true
        description: Новая роль участника и дополнительные параметры управления участником.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupMemberUpdateRequest'
      responses:
        '200':
          description: Роль участника успешно обновлена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMember'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags:
        - Group Members
      summary: Удалить участника из группы
      description: Исключает участника из группы. Операция доступна владельцу и администраторам группы с учетом иерархии ролей.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/MemberId'
      responses:
        '204':
          description: Участник успешно удален из группы.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /groups/{groupId}/features:
    get:
      tags:
        - Group Features
      summary: Получить настройки функций группы
      description: Возвращает текущий набор включенных и отключенных возможностей группы.
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Текущие настройки группы получены успешно.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupFeatures'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags:
        - Group Features
      summary: Изменить настройки функций группы
      description: Позволяет включить или отключить чат, уроки, задания, расписание и другие функции группы.
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        description: Набор функций, которые требуется включить или отключить.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupFeaturesUpdateRequest'
      responses:
        '200':
          description: Настройки функций группы успешно обновлены.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupFeatures'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /group-presets:
    get:
      tags:
        - Group Presets
      summary: Получить список шаблонов групп
      description: Возвращает доступные преднастроенные конфигурации группы, например обычная группа, класс или курс.
      responses:
        '200':
          description: Список шаблонов получен успешно.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupPreset'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /groups/{groupId}/presets/{presetKey}/apply:
    post:
      tags:
        - Group Presets
      summary: Применить шаблон к группе
      description: Применяет к существующей группе выбранный шаблон и автоматически обновляет тип группы и набор функций.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/PresetKey'
      responses:
        '200':
          description: Шаблон успешно применен к группе.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /groups/{groupId}/lessons:
    get:
      tags:
        - Lessons
      summary: Получить список уроков группы
      description: Возвращает уроки учебной группы или курса в порядке, заданном администраторами.
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Список уроков получен успешно.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lesson'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      tags:
        - Lessons
      summary: Создать урок
      description: Создает новый урок внутри группы, которая работает как класс или курс.
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        description: Данные нового урока.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonCreateRequest'
      responses:
        '201':
          description: Урок успешно создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /groups/{groupId}/lessons/{lessonId}:
    get:
      tags:
        - Lessons
      summary: Получить урок по идентификатору
      description: Возвращает подробную информацию об уроке, включая его параметры и статус публикации.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/LessonId'
      responses:
        '200':
          description: Урок найден и возвращен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags:
        - Lessons
      summary: Обновить урок
      description: Позволяет изменить содержимое урока, порядок и дату публикации.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/LessonId'
      requestBody:
        required: true
        description: Изменяемые поля урока.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonUpdateRequest'
      responses:
        '200':
          description: Урок успешно обновлен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        '400':
